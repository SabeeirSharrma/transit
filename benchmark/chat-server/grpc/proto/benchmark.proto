syntax = "proto3";

package chatserver;

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  rpc ModerateContent(ModerateContentRequest) returns (ModerateContentResponse);
  rpc RouteMessage(RouteMessageRequest) returns (RouteMessageResponse);
  rpc SearchMessages(SearchMessagesRequest) returns (SearchMessagesResponse);
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetChannelHistory(GetChannelHistoryRequest) returns (GetChannelHistoryResponse);
}

message SendMessageRequest {
  string channel_id = 1;
  string user_id = 2;
  string content = 3;
  int64 timestamp = 4;
}

message SendMessageResponse {
  string message_id = 1;
  bool delivered = 2;
  double execution_time_ms = 3;
}

message ValidateSessionRequest {
  string session_token = 1;
}

message ValidateSessionResponse {
  bool valid = 1;
  string user_id = 2;
  double execution_time_ms = 3;
}

message ModerateContentRequest {
  string content = 1;
  string user_id = 2;
}

message ModerateContentResponse {
  bool safe = 1;
  float toxicity_score = 2;
  string reason = 3;
  double execution_time_ms = 4;
}

message RouteMessageRequest {
  string message_id = 1;
  repeated string recipient_ids = 2;
}

message RouteMessageResponse {
  int32 delivered_count = 1;
  double execution_time_ms = 2;
}

message SearchMessagesRequest {
  string query = 1;
  string channel_id = 2;
  int32 limit = 3;
}

message SearchMessagesResponse {
  repeated SearchResult results = 1;
  double execution_time_ms = 2;
}

message SearchResult {
  string message_id = 1;
  string content = 2;
  float score = 3;
}

message GetAnalyticsRequest {
  string event_type = 1;
  int64 time_range_hours = 2;
}

message GetAnalyticsResponse {
  int32 event_count = 1;
  map<string, int32> breakdown = 2;
  double execution_time_ms = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  string username = 2;
  string email = 3;
  double execution_time_ms = 4;
}

message GetChannelHistoryRequest {
  string channel_id = 1;
  int32 limit = 2;
  string before_message_id = 3;
}

message GetChannelHistoryResponse {
  repeated Message messages = 1;
  double execution_time_ms = 2;
}

message Message {
  string message_id = 1;
  string user_id = 2;
  string content = 3;
  int64 timestamp = 4;
}
