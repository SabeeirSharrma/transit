[package]
name = "transit-scanner"
version = "0.1.0"
edition = "2021"
description = "Tree-sitter-based function discovery engine for Transit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["async"] }
napi-derive = "3"
tree-sitter = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-java = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"

[build-dependencies]
napi-build = "2"
