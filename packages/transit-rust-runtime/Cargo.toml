[package]
name = "transit-rust-runtime"
version = "0.1.0"
edition = "2021"
description = "Native addon bridge for in-process Rust calls via napi-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["async", "napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
